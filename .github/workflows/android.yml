name: Android CI

on:
  push:
    branches:
      - arena/01a0994e-project-aegis
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
          cache-read-only: false

      - name: Validate Gradle configuration
        run: gradle tasks --no-daemon

      - name: Run unit tests and assemble debug APK
        run: |
          set -o pipefail
          gradle clean testDebugUnitTest assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Publish compiler errors
        if: failure()
        run: |
          echo "## Compiler diagnostics" >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 build.log >> "$GITHUB_STEP_SUMMARY"
          grep -E "(^e: |error: |FAILURE:|What went wrong)" build.log | tail -n 50 | while IFS= read -r line; do
            echo "::error::$line"
          done
          diagnostic=$(awk '/FAILURE: Build failed/{capture=1} capture{print}' build.log | head -n 60 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Gradle failure detail::$diagnostic"

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: aegis-build-diagnostics
          path: build.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aegis-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: aegis-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
